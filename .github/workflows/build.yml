name: Build HideRLess Deb Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Theos Environment (Official Action)
      uses: theos/action@v1

    - name: Build Package
      run: |
        make clean
        make package

    - name: Upload Artifact (.deb)
      uses: actions/upload-artifact@v4
      with:
        name: HideRLess-deb-package
        path: packages/*.deb
