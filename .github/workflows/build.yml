name: Build HideRLess Deb Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-13  # Hoặc dùng ubuntu-latest bên dưới nếu muốn dùng Linux

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Theos & Dependencies (Linux Environment)
      run: |
        sudo apt-get update
        sudo apt-get install -y clang ldid make git curl dpkg-dev
        
        # Cài đặt Theos chuẩn
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        
        # Cài đặt toolchain (SDK / iPhoneOS SDK)
        sudo git clone --recursive https://github.com/theos/sdks.git $THEOS/sdks

    - name: Clean and Build Package
      run: |
        export THEOS=~/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make package

    - name: Upload Artifact (.deb)
      uses: actions/upload-artifact@v4
      with:
        name: HideRLess-deb-package
        path: packages/*.deb
