name: Build HideRLess Deb Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies & Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y make git curl dpkg-dev xz-utils bzip2 libxml2-utils

    - name: Setup Theos Environment, Toolchain & SDKs
      run: |
        export THEOS=~/theos
        rm -rf $THEOS
        
        # 1. Clone Theos chính chủ
        git clone --recursive https://github.com/theos/theos.git $THEOS

        # 2. Cài đặt ldid chuẩn cho Linux
        sudo curl -o /usr/local/bin/ldid -sL https://github.com/theos/ldid/releases/download/v2.1.5-procursus7/ldid-linux-x86_64
        sudo chmod +x /usr/local/bin/ldid

        # 3. Clone bộ iPhoneOS SDKs chuẩn
        rm -rf $THEOS/sdks
        git clone --recursive https://github.com/theos/sdks.git $THEOS/sdks

        # 4. Tải trực tiếp gói toolchain Linux prebuilt chuẩn của Theos qua curl/tar (không dùng git clone)
        mkdir -p $THEOS/toolchain/linux/iphone
        curl -sL https://github.com/theos/toolchain-linux/archive/refs/heads/master.tar.gz | tar -xz -C $THEOS/toolchain/linux/iphone --strip-components=1

    - name: Clean and Build Package
      run: |
        export THEOS=~/theos
        export PATH=$THEOS/bin:/usr/local/bin:$PATH
        
        # In ra cấu trúc thư mục để kiểm tra tệp tin
        echo "Checking repository structure:"
        ls -la
        echo "Checking HideApp contents:"
        ls -la HideApp/
        
        # Thực hiện build từ thư mục gốc
        make clean
        make package

    - name: Verify Deb Package Output
      run: |
        echo "Checking generated packages..."
        ls -la packages/

    - name: Upload Artifact (.deb)
      uses: actions/upload-artifact@v4
      with:
        name: HideRLess-deb-package
        path: packages/*.deb
